<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberPulse SOC Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .dashboard-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            border-left: 4px solid;
            margin-bottom: 20px;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-card.critical { border-left-color: #dc3545; }
        .stat-card.high { border-left-color: #fd7e14; }
        .stat-card.medium { border-left-color: #ffc107; }
        .stat-card.low { border-left-color: #28a745; }
        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 10px 0;
        }
        .stat-label {
            color: #6c757d;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        .table-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-top: 30px;
        }
        .severity-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .severity-critical { background: #dc3545; color: white; }
        .severity-high { background: #fd7e14; color: white; }
        .severity-medium { background: #ffc107; color: black; }
        .severity-low { background: #28a745; color: white; }
        .block-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            transition: all 0.3s;
        }
        .block-btn:hover {
            background: #c82333;
            transform: scale(1.05);
        }
        .unblock-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
        .header {
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 3rem;
            font-weight: 300;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .refresh-indicator {
            color: white;
            opacity: 0.8;
            font-size: 0.9rem;
        }
        .table th {
            border-top: none;
            color: #6c757d;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        .blocked-ip {
            background-color: #f8f9fa;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header text-center">
            <h1><i class="bi bi-shield-shaded"></i> CyberPulse SOC</h1>
            <p class="refresh-indicator">
                <i class="bi bi-arrow-repeat"></i> Auto-refreshes every 5 seconds
                <span class="mx-2">|</span>
                <span id="lastRefresh">Just now</span>
            </p>
        </div>

        <!-- Stats Cards -->
        <div class="row" id="statsRow">
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-label">Total Attacks</div>
                    <div class="stat-value" id="totalAttacks">0</div>
                    <i class="bi bi-shield-exclamation" style="font-size: 2rem; color: #6c757d; position: absolute; top: 20px; right: 20px;"></i>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card critical">
                    <div class="stat-label">Critical</div>
                    <div class="stat-value" id="criticalCount">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card high">
                    <div class="stat-label">High</div>
                    <div class="stat-value" id="highCount">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-label">Blocked IPs</div>
                    <div class="stat-value" id="blockedCount">0</div>
                </div>
            </div>
        </div>

        <!-- Main Dashboard Card -->
        <div class="dashboard-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3><i class="bi bi-list-check"></i> Security Events</h3>
                <button class="btn btn-outline-primary" onclick="refreshData()">
                    <i class="bi bi-arrow-repeat"></i> Refresh
                </button>
            </div>
            
            <div class="table-container">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Event Type</th>
                            <th>IP Address</th>
                            <th>Severity</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="eventsBody">
                        <tr>
                            <td colspan="6" class="text-center py-4">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Blocked IPs Card -->
        <div class="dashboard-card">
            <h3 class="mb-4"><i class="bi bi-shield-lock"></i> Blocked IPs</h3>
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>IP Address</th>
                            <th>Blocked At</th>
                            <th>Reason</th>
                            <th>Events</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="blockedIPsBody">
                        <tr>
                            <td colspan="5" class="text-center py-4">No blocked IPs</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://3.145.146.136:5000/api';
        let detections = [];
        let blockedIPs = [];

        async function fetchData() {
            try {
                const [eventsRes, blockedRes] = await Promise.all([
                    fetch(`${API_BASE}/security-events`),
                    fetch(`${API_BASE}/blocked-ips`)
                ]);
                
                const eventsData = await eventsRes.json();
                const blockedData = await blockedRes.json();
                
                detections = eventsData.data || [];
                blockedIPs = blockedData.blocked_ips || [];
                
                updateDashboard();
                updateLastRefresh();
            } catch (error) {
                console.error('Fetch error:', error);
                document.getElementById('eventsBody').innerHTML = 
                    '<tr><td colspan="6" class="text-center text-danger">Failed to connect to API</td></tr>';
            }
        }

        function updateDashboard() {
            updateStats();
            updateEventsTable();
            updateBlockedTable();
        }

        function updateStats() {
            const total = detections.length;
            const critical = detections.filter(d => d.severity === 'critical').length;
            const high = detections.filter(d => d.severity === 'high').length;
            
            document.getElementById('totalAttacks').textContent = total;
            document.getElementById('criticalCount').textContent = critical;
            document.getElementById('highCount').textContent = high;
            document.getElementById('blockedCount').textContent = blockedIPs.length;
        }

        function updateEventsTable() {
            const eventsBody = document.getElementById('eventsBody');
            
            if (detections.length === 0) {
                eventsBody.innerHTML = '<tr><td colspan="6" class="text-center py-4">No security events detected</td></tr>';
                return;
            }

            eventsBody.innerHTML = detections.slice(-20).reverse().map(d => {
                const isBlocked = blockedIPs.some(b => b.ip === d.ip_address);
                const severityClass = d.severity === 'critical' ? 'severity-critical' :
                                    d.severity === 'high' ? 'severity-high' :
                                    d.severity === 'medium' ? 'severity-medium' : 'severity-low';
                
                return `
                    <tr class="${isBlocked ? 'blocked-ip' : ''}">
                        <td>${new Date(d.timestamp).toLocaleString()}</td>
                        <td>${d.event_type}</td>
                        <td>${d.ip_address}</td>
                        <td><span class="severity-badge ${severityClass}">${d.severity}</span></td>
                        <td>${isBlocked ? '<span class="badge bg-secondary">Blocked</span>' : '<span class="badge bg-success">Active</span>'}</td>
                        <td>
                            ${!isBlocked ? 
                                `<button class="block-btn" onclick="blockIP('${d.ip_address}', '${d.event_type}')">
                                    <i class="bi bi-shield"></i> Block
                                </button>` : 
                                `<button class="unblock-btn" onclick="unblockIP('${d.ip_address}')">
                                    <i class="bi bi-shield-check"></i> Unblock
                                </button>`
                            }
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function updateBlockedTable() {
            const blockedBody = document.getElementById('blockedIPsBody');
            
            if (blockedIPs.length === 0) {
                blockedBody.innerHTML = '<tr><td colspan="5" class="text-center py-4">No blocked IPs</td></tr>';
                return;
            }

            blockedBody.innerHTML = blockedIPs.map(b => `
                <tr>
                    <td>${b.ip}</td>
                    <td>${new Date(b.timestamp).toLocaleString()}</td>
                    <td>${b.reason || 'Automated block'}</td>
                    <td>${detections.filter(d => d.ip_address === b.ip).length}</td>
                    <td>
                        <button class="unblock-btn" onclick="unblockIP('${b.ip}')">
                            <i class="bi bi-shield-check"></i> Unblock
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        async function blockIP(ip, reason) {
            try {
                const response = await fetch(`${API_BASE}/automated-response/block-ip`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip_address: ip, reason: `Manual block for ${reason}` })
                });
                
                if (response.ok) {
                    alert(`IP ${ip} blocked successfully`);
                    fetchData();
                }
            } catch (error) {
                alert('Failed to block IP');
            }
        }

        async function unblockIP(ip) {
            if (confirm(`Unblock ${ip}?`)) {
                alert(`IP ${ip} unblocked`);
                fetchData();
            }
        }

        function refreshData() {
            fetchData();
        }

        function updateLastRefresh() {
            document.getElementById('lastRefresh').textContent = 'Just now';
            setTimeout(() => {
                document.getElementById('lastRefresh').textContent = '5s ago';
            }, 5000);
        }

        // Initial load
        fetchData();
        
        // Auto-refresh every 5 seconds
        setInterval(fetchData, 5000);
    </script>
</body>
</html>
